function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  timerClockEl.textContent = formatTime(timerSecondsLeft);
  timerRoundEl.textContent = `Round ${timerRoundNum} · ${Math.floor(timerGoalSeconds/60)}:00 goal`;
  timerCardsEl.textContent = `${cardsThisRound} card${cardsThisRound===1?'':'s'} this round`;
  timerClockEl.classList.toggle('warn', timerSecondsLeft <= 30);
}
function markCardViewed(){
  cardsThisRound++;
  renderTimer();
}
function tickTimer(){
  timerSecondsLeft--;
  if(timerSecondsLeft <= 0){
    clearInterval(timerInterval);
    timerRunning = false;
    timerStartBtn.textContent = 'Start';
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance('Round complete!');
      speechSynthesis.speak(u);
    }
    alert(`⏰ Round ${timerRoundNum} complete! You viewed ${cardsThisRound} cards. Next round: ${Math.floor((timerGoalSeconds+180)/60)} minutes.`);
    timerRoundNum++;
    timerGoalSeconds += 180;
    timerSecondsLeft = timerGoalSeconds;
    cardsThisRound = 0;
    renderTimer();
    return;
  }
  renderTimer();
}
timerStartBtn.addEventListener('click', ()=>{
  if(timerRunning){
    clearInterval(timerInterval);
    timerRunning = false;
    timerStartBtn.textContent = 'Start';
  } else {
    timerRunning = true;
    timerStartBtn.textContent = 'Pause';
    timerInterval = setInterval(tickTimer, 1000);
  }
});
timerResetBtn.addEventListener('click', ()=>{
  clearInterval(timerInterval);
  timerRunning = false;
  timerStartBtn.textContent = 'Start';
  timerRoundNum = 1;
  timerGoalSeconds = 7*60;
  timerSecondsLeft = timerGoalSeconds;
  cardsThisRound = 0;
  renderTimer();
});

function buildPrint(){
  const src = getPrintWords();
  const area = document.getElementById('printArea');
  if(src.length===0){ alert("No cards to print in this deck/filter."); area.innerHTML=''; return; }
  let html = `<div class="print-instructions">Print double-sided • Flip on long edge • ${src.length} cards • Deck: ${activeDeckFilter==='ALL'?'ALL DECKS':activeDeckFilter}</div>`;
  const PER_PAGE = 8;
  for(let i=0;i<src.length;i+=PER_PAGE){
    const chunk = src.slice(i,i+PER_PAGE);
    html += `<div class="print-page"><div class="print-label">FRONT — Hebrew (cards ${i+1}-${i+chunk.length}) — cut along lines</div><div class="print-grid">`;
    chunk.forEach(w=>{ html += `<div class="p-card p-front"><div class="p-heb">${displayHeb(w.heb)}</div>${w.sentence?`<div class="p-sent">${displayHeb(w.sentence)}</div>`:''}</div>`; });
    for(let k=chunk.length;k<PER_PAGE;k++) html+=`<div class="p-card p-empty"></div>`;
    html += `</div></div>`;
    let mirrored=[];
    for(let r=0;r<chunk.length;r+=2){
      if(r+1<chunk.length){ mirrored.push(chunk[r+1]); mirrored.push(chunk[r]); }
      else mirrored.push(chunk[r]);
    }
    html += `<div class="print-page"><div class="print-label">BACK — English (flip on long edge)</div><div class="print-grid">`;
    mirrored.forEach(w=>{ html += `<div class="p-card p-back"><div class="p-eng">${w.eng}</div></div>`; });
    for(let k=chunk.length;k<PER_PAGE;k++) html+=`<div class="p-card p-empty"></div>`;
    html += `</div></div>`;
  }
  area.innerHTML = html;
}
document.getElementById('printBtn').addEventListener('click', ()=>{
  const ok = confirm("To print double-sided:\n\nChoose Double-sided / Two-sided and choose Flip on long edge.\n\nFront = Hebrew, Back = English.\n\nPress OK to continue to print.");
  if(!ok) return;
  buildPrint();
  setTimeout(()=>window.print(),150);
});
