<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebrew Flashcards</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{ --bg:#111318; --card:#1c1f27; --accent:#3ea6ff; --text:#f2f2f2; --muted:#9aa1ab; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);}
  header{display:flex;justify-content:space-around;padding:10px 0;background:#0b0d11;position:sticky;top:0;z-index:10;}
  header button{background:none;border:none;color:var(--muted);font-size:13px;padding:8px 4px;}
  header button.active{color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent);}
  .page{display:none;padding:16px;max-width:480px;margin:0 auto;}
  .page.active{display:block;}
  label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted);}
  input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#0e1015;color:var(--text);font-size:16px;}
  textarea{resize:vertical;min-height:50px;}
  button.primary{margin-top:16px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#001522;font-weight:700;font-size:16px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .toolbar button{flex:1;min-width:70px;padding:8px 6px;border-radius:8px;border:1px solid #333;background:#181b22;color:var(--text);font-size:11px;}
  .toolbar button.on{background:var(--accent);color:#001522;font-weight:700;}
  .direction-bar{display:flex;gap:8px;margin-bottom:14px;}
  .direction-bar button{flex:1;padding:10px 6px;border-radius:8px;border:1px solid #333;background:#181b22;color:var(--text);font-size:12px;font-weight:600;}
  .direction-bar button.on{background:var(--accent);color:#001522;}
  .deck-bar{display:flex;gap:8px;margin-bottom:6px;align-items:center;}
  .deck-bar select{flex:1;}
  .card-counter{text-align:center;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;}
  .timer-box{background:#181b22;border-radius:12px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .timer-info{display:flex;flex-direction:column;}
  .timer-round{font-size:11px;color:var(--muted);}
  .timer-clock{font-size:26px;font-weight:700;font-family:monospace;}
  .timer-clock.warn{color:#ff5c5c;}
  .timer-cards{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px;}
  .timer-btns{display:flex;gap:6px;}
  .timer-btns button{padding:8px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;background:var(--accent);color:#001522;}
  .timer-btns button.reset{background:#2a2d36;color:var(--text);}
  .card-wrap{position:relative;height:340px;touch-action:pan-y;}
  .card{position:absolute;inset:0;background:var(--card);border-radius:18px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .front-word{font-size:52px;font-weight:700;line-height:1.2;}
  .front-word.heb{direction:rtl;}
  .front-word.script{font-style:italic;font-family:"Times New Roman",serif;font-weight:400;}
  .sentence{direction:rtl;font-size:16px;color:var(--muted);margin-top:14px;line-height:1.5;}
  .sentence b{color:var(--text);font-weight:700;}
  .reveal{margin-top:18px;min-height:70px;}
  .reveal .big{font-size:26px;font-weight:600;}
  .reveal .big.heb{direction:rtl;}
  .reveal .translit{font-size:14px;color:var(--muted);margin-top:4px;}
  .reveal .backSentence{direction:rtl;font-size:15px;color:var(--muted);margin-top:8px;}
  .reveal .addedBy{font-size:11px;color:var(--muted);margin-top:10px;}
  .hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;}
  .speak-btn{margin-top:10px;padding:8px 16px;border-radius:20px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:14px;}
  .nav-row{display:flex;justify-content:space-between;margin-top:14px;gap:8px;}
  .nav-row button{flex:1;padding:14px 0;border-radius:10px;border:none;font-size:16px;font-weight:700;background:#20242e;color:var(--text);}
  .nav-row .flip-btn{background:var(--accent);color:#001522;}
  .controls{display:flex;justify-content:space-between;margin-top:10px;gap:8px;flex-wrap:wrap;}
  .controls button{flex:1;min-width:70px;padding:12px 0;border-radius:10px;border:none;font-size:13px;font-weight:600;}
  .btn-skip{background:#2a2d36;color:var(--text);}
  .btn-star{background:#2a2d36;color:gold;}
  .btn-star.starred{background:gold;color:#111;}
  .btn-shuffle{background:#2a2d36;color:var(--text);}
  .btn-edit{background:#2a2d36;color:#7ec9ff;}
  .word-list li{background:#181b22;border-radius:10px;padding:10px;margin-bottom:8px;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .word-list button{background:none;border:none;color:#ff5c5c;font-size:14px;}
  .word-list .meta{font-size:11px;color:var(--muted);display:block;}
  .empty{text-align:center;color:var(--muted);margin-top:60px;}
  .status{font-size:12px;color:var(--accent);min-height:16px;margin-top:2px;}
  .field-row{display:flex;gap:8px;align-items:flex-end;}
  .field-row input{flex:1;}
  .translate-btn{white-space:nowrap;padding:10px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;}
  .translate-btn.listening{background:#ff5c5c;border-color:#ff5c5c;color:#fff;}
  .toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;background:#181b22;padding:10px;border-radius:10px;}
  .toggle-row input{width:auto;}
  .toggle-row label{margin:0;font-size:13px;color:var(--text);}
  .deck-manage{display:flex;gap:8px;margin-bottom:14px;}
  .deck-manage input{flex:1;}
  .deck-manage button{padding:10px 14px;border-radius:8px;border:none;background:var(--accent);color:#001522;font-weight:700;}
  .deck-list li{background:#181b22;border-radius:10px;padding:10px;margin-bottom:8px;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .deck-list button{background:none;border:none;color:#ff5c5c;font-size:13px;}
  .sync-banner{font-size:12px;text-align:center;padding:6px;border-radius:8px;margin-bottom:10px;}
  .sync-ok{background:#123a1f;color:#7ee2a0;}
  .sync-bad{background:#3a1212;color:#ff9c9c;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal-box h3{margin-top:0;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px 0;border-radius:10px;border:none;font-weight:700;}
  .modal-save{background:var(--accent);color:#001522;}
  .modal-cancel{background:#2a2d36;color:var(--text);}
  #printArea{display:none;}
  @media print{
    header, .page, .modal-overlay{display:none !important;}
    body{background:#fff;}
    #printArea{display:block !important;color:#000;}
    .print-instructions{font-size:12pt;margin-bottom:10px;color:#000;}
    .print-page{page-break-after:always;break-after:page;}
    .print-label{font-size:10pt;color:#000;margin-bottom:6px;}
    .print-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4, 2.2in);gap:0;}
    .p-card{border:1px dashed #000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0.2in;overflow:hidden;background:#fff !important;color:#000 !important;}
    .p-front{direction:rtl;}
    .p-heb{font-size:28pt;font-weight:700;}
    .p-sent{font-size:11pt;margin-top:6pt;}
    .p-back{direction:ltr;}
    .p-eng{font-size:16pt;font-weight:700;}
    .p-empty{border:1px dashed #aaa;}
  }
</style>
</head>
<body>

<header>
  <button data-page="practice" class="active">Practice</button>
  <button data-page="add">Add Word</button>
  <button data-page="decks">Decks</button>
  <button data-page="manage">My Words</button>
</header>

<div class="page active" id="page-practice">
  <div class="sync-banner sync-ok" id="syncBanner">Connecting…</div>
  <div class="deck-bar"><select id="deckFilter"></select></div>
  <div class="card-counter" id="cardCounter">0/0</div>
  <div class="timer-box">
    <div class="timer-info">
      <div class="timer-round" id="timerRound">Round 1 · 7:00 goal</div>
      <div class="timer-clock" id="timerClock">07:00</div>
      <div class="timer-cards" id="timerCards">0 cards this round</div>
    </div>
    <div class="timer-btns">
      <button id="timerStartBtn">Start</button>
      <button class="reset" id="timerResetBtn">Reset</button>
    </div>
  </div>
  <div class="direction-bar">
    <button id="dirHebFirst" class="on">🇮🇱 Hebrew First</button>
    <button id="dirEngFirst">🇬🇧 English First</button>
  </div>
  <div class="toolbar">
    <button id="toggleNiqqud">Hide Dots</button>
    <button id="toggleScript">Script</button>
    <button id="filterStar">★ Only</button>
    <button id="printBtn">🖨️ Print</button>
  </div>
  <div class="card-wrap" id="cardWrap"><div class="empty" id="emptyMsg">Loading…</div></div>
  <div class="nav-row">
    <button id="prevBtn">◀ Back</button>
    <button class="flip-btn" id="flipBtn">Flip</button>
    <button id="nextBtn">Next ▶</button>
  </div>
  <div class="controls">
    <button class="btn-skip" id="skipBtn">Skip ▶</button>
    <button class="btn-star" id="starBtn">★ Star</button>
    <button class="btn-shuffle" id="shuffleBtn">🔀 Shuffle</button>
    <button class="btn-edit" id="editCardBtn">✏️ Edit</button>
  </div>
  <div class="hint">Tap the card, or use Flip/Back/Next · swipe also works</div>
</div>

<div class="page" id="page-add">
  <label>Your name (shown as who added the word — optional)</label>
  <input id="inAddedBy" placeholder="e.g. Jordan">
  <div class="toggle-row">
    <input type="checkbox" id="autoTranslateToggle">
    <label for="autoTranslateToggle">Auto-translate as I type</label>
  </div>
  <label>Deck</label>
  <select id="inDeck"></select>
  <label>Hebrew word or sentence</label>
  <div class="field-row">
    <input id="inHeb" placeholder="שָׁלוֹם" dir="rtl">
    <button class="translate-btn" id="voiceHebBtn">🎤</button>
    <button class="translate-btn" id="manualTranslateToEng">Translate →</button>
  </div>
  <div class="status" id="voiceHebStatus"></div>
  <div class="status" id="hebStatus"></div>
  <label>English meaning</label>
  <div class="field-row">
    <input id="inEng" placeholder="hello / peace">
    <button class="translate-btn" id="manualTranslateToHeb">← Translate</button>
  </div>
  <div class="status" id="engStatus"></div>
  <label>Transliteration (auto-guessed, editable)</label>
  <input id="inTranslit" placeholder="shalom">
  <label>Example sentence (Hebrew, optional)</label>
  <div class="field-row">
    <textarea id="inSentence" dir="rtl" placeholder="אֲנִי אוֹמֵר שָׁלוֹם"></textarea>
    <button class="translate-btn" id="voiceSentenceBtn">🎤</button>
  </div>
  <div class="status" id="voiceSentenceStatus"></div>
  <button class="primary" id="saveBtn">Save Word</button>
</div>

<div class="page" id="page-decks">
  <label>Create a new deck</label>
  <div class="deck-manage">
    <input id="newDeckName" placeholder="e.g. Chapter 3 Vocab">
    <button id="addDeckBtn">Add</button>
  </div>
  <ul class="deck-list" id="deckList"></ul>
</div>

<div class="page" id="page-manage">
  <ul class="word-list" id="wordList"></ul>
</div>

<div id="printArea"></div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3>Edit Word</h3>
    <label>Hebrew</label>
    <input id="editHeb" dir="rtl">
    <label>English</label>
    <input id="editEng">
    <label>Transliteration</label>
    <input id="editTranslit">
    <label>Deck</label>
    <select id="editDeck"></select>
    <label>Example sentence (Hebrew)</label>
    <textarea id="editSentence" dir="rtl"></textarea>
    <div class="modal-actions">
      <button class="modal-cancel" id="editCancelBtn">Cancel</button>
      <button class="modal-save" id="editSaveBtn">Save Changes</button>
    </div>
  </div>
</div>

<script>
const EDIT_PASSCODE = "613";
const firebaseConfig = {
  apiKey: "AIzaSyChe-jqMqtme1qTdsQKtr4SRffzCXUDgl0",
  authDomain: "h-flash-cards.firebaseapp.com",
  projectId: "h-flash-cards",
  storageBucket: "h-flash-cards.firebasestorage.app",
  messagingSenderId: "977013443652",
  appId: "1:977013443652:web:81d75c6452e4cd4b230011",
  measurementId: "G-G3TQ1G96PT"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const wordsCol = db.collection("words");
const decksCol = db.collection("decks");
const DEFAULT_DECK = "ALL DECKS";
const LEGACY_DECK = "General";
function normDeck(d){
  if(!d) return DEFAULT_DECK;
  if(d === LEGACY_DECK) return DEFAULT_DECK;
  return d;
}
let words = [];
let decks = [DEFAULT_DECK];
let deckQueue = [];
let current = 0;
let showNiqqud = true;
let scriptMode = false;
let revealed = false;
let starOnly = false;
let autoTranslate = false;
let direction = 'h2e';
let activeDeckFilter = 'ALL';
let editingWordId = null;
const syncBanner = document.getElementById('syncBanner');
const cardCounterEl = document.getElementById('cardCounter');

// ---- Practice Timer + Cards This Round ----
let timerRoundNum = 1;
let timerGoalSeconds = 7*60;
let timerSecondsLeft = timerGoalSeconds;
let timerInterval = null;
let timerRunning = false;
let cardsThisRound = 0;
const timerClockEl = document.getElementById('timerClock');
const timerRoundEl = document.getElementById('timerRound');
const timerCardsEl = document.getElementById('timerCards');
const timerStartBtn = document.getElementById('timerStartBtn');
const timerResetBtn = document.getElementById('timerResetBtn');
function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  timerClockEl.textContent = formatTime(timerSecondsLeft);
  timerRoundEl.textContent = `Round ${timerRoundNum} · ${Math.floor(timerGoalSeconds/60)}:00 goal`;
  timerCardsEl.textContent = `${cardsThisRound} card${cardsThisRound===1?'':'s'} this round`;
  timerClockEl.classList.toggle('warn', timerSecondsLeft <= 30);
}
function markCardViewed(){
  cardsThisRound++;
  renderTimer();
}
function tickTimer(){
  timerSecondsLeft--;
  if(timerSecondsLeft <= 0){
    clearInterval(timerInterval);
    timerRunning = false;
    timerStartBtn.textContent = 'Start';
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance('Round complete!');
      speechSynthesis.speak(u);
    }
    alert(`⏰ Round ${timerRoundNum} complete! You viewed ${cardsThisRound} cards. Next round: ${Math.floor((timerGoalSeconds+180)/60)} minutes.`);
    timerRoundNum++;
    timerGoalSeconds += 180;
    timerSecondsLeft = timerGoalSeconds;
    cardsThisRound = 0;
    renderTimer();
    return;
  }
  renderTimer();
}
timerStartBtn.addEventListener('click', ()=>{
  if(timerRunning){
    clearInterval(timerInterval);
    timerRunning = false;
    timerStartBtn.textContent = 'Start';
  } else {
    timerRunning = true;
    timerStartBtn.textContent = 'Pause';
    timerInterval = setInterval(tickTimer, 1000);
  }
});
timerResetBtn.addEventListener('click', ()=>{
  clearInterval(timerInterval);
  timerRunning = false;
  timerStartBtn.textContent = 'Start';
  timerRoundNum = 1;
  timerGoalSeconds = 7*60;
  timerSecondsLeft = timerGoalSeconds;
  cardsThisRound = 0;
  renderTimer();
});
renderTimer();

function checkPasscode(){
  if(sessionStorage.getItem('editUnlocked') === 'true') return true;
  const entered = prompt("Enter the class passcode to add, edit, or delete:");
  if(entered === null) return false;
  if(entered === EDIT_PASSCODE){
    sessionStorage.setItem('editUnlocked', 'true');
    return true;
  }
  alert("Incorrect passcode.");
  return false;
}
const NAME_KEY = "hebrewFlashcards_myName";
document.getElementById('inAddedBy').value = localStorage.getItem(NAME_KEY) || "";
document.getElementById('inAddedBy').addEventListener('input', e=>{
  localStorage.setItem(NAME_KEY, e.target.value);
});
wordsCol.onSnapshot(snap=>{
  words = snap.docs.map(d=>{
    const data = d.data();
    return { id:d.id, ...data, deck: normDeck(data.deck) };
  });
  syncBanner.textContent = "✓ Synced — shared with everyone using this link";
  syncBanner.className = "sync-banner sync-ok";
  rebuildDeckQueue();
  if(document.getElementById('page-manage').classList.contains('active')) renderManage();
}, err=>{
  syncBanner.textContent = "⚠ Not connected — check your Firebase setup";
  syncBanner.className = "sync-banner sync-bad";
  console.error(err);
});
decksCol.onSnapshot(snap=>{
  const fetched = snap.docs.map(d=>d.data().name).filter(Boolean);
  const cleaned = fetched.filter(n=>n!==DEFAULT_DECK && n!==LEGACY_DECK);
  decks = [DEFAULT_DECK, ...cleaned];
  refreshDeckDropdowns();
  if(document.getElementById('page-decks').classList.contains('active')) renderDecks();
});
const CONSONANTS = {'א':'','ב':'v','ג':'g','ד':'d','ה':'h','ו':'v','ז':'z','ח':'ch','ט':'t','י':'y','כ':'kh','ך':'kh','ל':'l','מ':'m','ם':'m','נ':'n','ן':'n','ס':'s','ע':'','פ':'f','ף':'f','צ':'tz','ץ':'tz','ק':'k','ר':'r','ש':'sh','ת':'t'};
const NIQQUD = {'\u05B0':'','\u05B1':'e','\u05B2':'a','\u05B3':'o','\u05B4':'i','\u05B5':'e','\u05B6':'e','\u05B7':'a','\u05B8':'a','\u05B9':'o','\u05BA':'o','\u05BB':'u','\u05BC':'','\u05C1':'','\u05C2':'','\u05C7':''};
function transliterate(heb){ let out=""; for(const ch of heb){ if(CONSONANTS[ch]!==undefined) out+=CONSONANTS[ch]; else if(NIQQUD[ch]!==undefined) out+=NIQQUD[ch]; else if(ch===' ') out+=' '; } return out||""; }
function stripNiqqud(str){ return (str||"").replace(/[\u0591-\u05C7]/g,""); }
async function translateText(text, from, to){
  if(!text.trim()) return "";
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
  const res = await fetch(url);
  const data = await res.json();
  return data?.responseData?.translatedText || "";
}
const hebInput = document.getElementById('inHeb');
const engInput = document.getElementById('inEng');
const hebStatus = document.getElementById('hebStatus');
const engStatus = document.getElementById('engStatus');
const autoToggle = document.getElementById('autoTranslateToggle');
const deckFilterEl = document.getElementById('deckFilter');
const inDeckEl = document.getElementById('inDeck');
autoToggle.addEventListener('change', ()=>{ autoTranslate = autoToggle.checked; });
let debounceTimer = null;
hebInput.addEventListener('input', ()=>{
  document.getElementById('inTranslit').value = transliterate(hebInput.value);
  if(!autoTranslate) return;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(()=> runTranslate('heb-to-eng'), 700);
});
engInput.addEventListener('input', ()=>{
  if(!autoTranslate) return;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(()=> runTranslate('eng-to-heb'), 700);
});
document.getElementById('manualTranslateToEng').addEventListener('click', ()=> runTranslate('heb-to-eng'));
document.getElementById('manualTranslateToHeb').addEventListener('click', ()=> runTranslate('eng-to-heb'));
async function runTranslate(dir){
  if(dir==='heb-to-eng'){
    const val = hebInput.value.trim();
    if(!val){ engStatus.textContent=''; return; }
    engStatus.textContent = 'Translating…';
    try{ const t = await translateText(val,'he','en'); if(t){ engInput.value=t; engStatus.textContent='Translated from Hebrew (check it!)'; } else engStatus.textContent='Could not translate — enter manually.'; }
    catch(e){ engStatus.textContent='Translation unavailable — enter manually.'; }
  } else {
    const val = engInput.value.trim();
    if(!val){ hebStatus.textContent=''; return; }
    hebStatus.textContent = 'Translating…';
    try{
      const t = await translateText(val,'en','he');
      if(t){ hebInput.value=t; document.getElementById('inTranslit').value=transliterate(t); hebStatus.textContent='Translated from English (check it!)'; }
      else hebStatus.textContent='Could not translate — enter manually.';
    }catch(e){ hebStatus.textContent='Translation unavailable — enter manually.'; }
  }
}
function startHebrewDictation(targetEl, statusEl, btnEl){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Voice input isn't supported in this browser. On iPhone, tap the microphone on your keyboard instead to dictate in Hebrew."); return; }
  const rec = new SR();
  rec.lang = 'he-IL';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  statusEl.textContent = 'Listening… speak in Hebrew';
  btnEl.classList.add('listening');
  btnEl.textContent = '🔴';
  rec.onresult = (e)=>{
    const transcript = e.results[0][0].transcript.trim();
    targetEl.value = transcript;
    targetEl.dispatchEvent(new Event('input'));
    statusEl.textContent = 'Heard you — check and edit if needed.';
    btnEl.classList.remove('listening');
    btnEl.textContent = '🎤';
  };
  rec.onerror = ()=>{
    statusEl.textContent = 'Could not hear – try again.';
    btnEl.classList.remove('listening');
    btnEl.textContent = '🎤';
  };
  rec.onend = ()=>{ btnEl.classList.remove('listening'); if(btnEl.textContent==='🔴') btnEl.textContent='🎤'; };
  try{ rec.start(); }catch(err){ statusEl.textContent = 'Voice busy – try again.'; btnEl.classList.remove('listening'); btnEl.textContent='🎤'; }
}
document.getElementById('voiceHebBtn').addEventListener('click', ()=>{
  startHebrewDictation(hebInput, document.getElementById('voiceHebStatus'), document.getElementById('voiceHebBtn'));
});
document.getElementById('voiceSentenceBtn').addEventListener('click', ()=>{
  startHebrewDictation(document.getElementById('inSentence'), document.getElementById('voiceSentenceStatus'), document.getElementById('voiceSentenceBtn'));
});
document.querySelectorAll('header button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('header button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-'+btn.dataset.page).classList.add('active');
    if(btn.dataset.page==='manage') renderManage();
    if(btn.dataset.page==='decks') renderDecks();
    if(btn.dataset.page==='add') refreshDeckDropdowns();
    if(btn.dataset.page==='practice') rebuildDeckQueue();
  });
});
function refreshDeckDropdowns(){
  inDeckEl.innerHTML = decks.map(d=>`<option value="${d}">${d}</option>`).join('');
  document.getElementById('editDeck').innerHTML = decks.map(d=>`<option value="${d}">${d}</option>`).join('');
  const prevVal = deckFilterEl.value || 'ALL';
  deckFilterEl.innerHTML = `<option value="ALL">ALL DECKS</option>` + decks.filter(d=>d!==DEFAULT_DECK).map(d=>`<option value="${d}">${d}</option>`).join('');
  deckFilterEl.value = (prevVal==='ALL' || decks.includes(prevVal)) ? prevVal : 'ALL';
  activeDeckFilter = deckFilterEl.value;
}
deckFilterEl.addEventListener('change', ()=>{ activeDeckFilter = deckFilterEl.value; rebuildDeckQueue(); });
document.getElementById('addDeckBtn').addEventListener('click', async ()=>{
  if(!checkPasscode()) return;
  const name = document.getElementById('newDeckName').value.trim();
  if(!name) return;
  if(normDeck(name)===DEFAULT_DECK || decks.includes(name)){ alert('That deck already exists.'); return; }
  await decksCol.add({ name });
  document.getElementById('newDeckName').value = '';
});
function renderDecks(){
  const list = document.getElementById('deckList');
  list.innerHTML = '';
  decks.forEach(d=>{
    const count = words.filter(w=>normDeck(w.deck)===d).length;
    const li = document.createElement('li');
    li.innerHTML = `<span>${d} <span style="color:var(--muted);font-size:12px;">(${count} word${count===1?'':'s'})</span></span>`;
    if(d !== DEFAULT_DECK){
      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.addEventListener('click', async ()=>{
        if(!checkPasscode()) return;
        if(!confirm(`Delete deck "${d}"? Its words will move to "${DEFAULT_DECK}".`)) return;
        const toMove = words.filter(w=>normDeck(w.deck)===d);
        await Promise.all(toMove.map(w=> wordsCol.doc(w.id).update({ deck: DEFAULT_DECK })));
        const snap = await decksCol.where("name","==",d).get();
        await Promise.all(snap.docs.map(docu=> decksCol.doc(docu.id).delete()));
      });
      li.appendChild(del);
    }
    list.appendChild(li);
  });
}
document.getElementById('saveBtn').addEventListener('click', async ()=>{
  if(!checkPasscode()) return;
  const heb = hebInput.value.trim();
  const eng = engInput.value.trim();
  if(!heb || !eng){ alert("Please fill in both the Hebrew and English fields."); return; }
  const word = {
    heb, eng,
    translit: document.getElementById('inTranslit').value.trim(),
    sentence: document.getElementById('inSentence').value.trim(),
    deck: normDeck(inDeckEl.value) || DEFAULT_DECK,
    starred: false,
    addedBy: document.getElementById('inAddedBy').value.trim() || "Anonymous",
    createdAt: Date.now()
  };
  await wordsCol.add(word);
  hebInput.value=''; engInput.value='';
  document.getElementById('inTranslit').value='';
  document.getElementById('inSentence').value='';
  hebStatus.textContent=''; engStatus.textContent='';
  document.getElementById('voiceHebStatus').textContent='';
  document.getElementById('voiceSentenceStatus').textContent='';
  alert("Saved! Everyone using this link will see it too.");
});
function renderManage(){
  const list = document.getElementById('wordList');
  list.innerHTML = '';
  if(words.length===0){ list.innerHTML = '<div class="empty">No words yet.</div>'; return; }
  words.forEach(w=>{
    const li = document.createElement('li');
    li.innerHTML = `<span dir="rtl">${w.heb} — ${w.eng}<span class="meta" dir="ltr">Deck: ${normDeck(w.deck)} · Added by: ${w.addedBy||'Anonymous'}</span></span>`;
    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.addEventListener('click', async ()=>{
      if(!checkPasscode()) return;
      await wordsCol.doc(w.id).delete();
    });
    li.appendChild(del);
    list.appendChild(li);
  });
}
function rebuildDeckQueue(){
  let source = words;
  if(activeDeckFilter !== 'ALL') source = source.filter(w=>normDeck(w.deck)===activeDeckFilter);
  if(starOnly) source = source.filter(w=>w.starred);
  deckQueue = source.slice();
  current = 0;
  renderCard();
}
function displayHeb(heb){ return showNiqqud ? heb : stripNiqqud(heb); }
function boldSentence(sentence, heb){
  if(!sentence) return "";
  const bare = stripNiqqud(heb).trim();
  if(!bare) return showNiqqud ? sentence : stripNiqqud(sentence);
  const escaped = bare.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re = new RegExp(escaped,"g");
  const shownSentence = showNiqqud ? sentence : stripNiqqud(sentence);
  return shownSentence.replace(re, m=>`<b>${m}</b>`);
}
function updateCounter(){
  if(deckQueue.length===0){
    cardCounterEl.textContent = `0/0`;
  } else {
    cardCounterEl.textContent = `${current+1}/${deckQueue.length}`;
  }
}
function renderCard(){
  const wrap = document.getElementById('cardWrap');
  wrap.innerHTML = '';
  if(deckQueue.length===0){
    wrap.innerHTML = '<div class="empty">No words to show. Add some, pick a different deck, or turn off ★ Only.</div>';
    updateCounter();
    return;
  }
  if(current>=deckQueue.length) current = 0;
  if(current<0) current = deckQueue.length-1;
  const w = deckQueue[current];
  revealed = false;
  const card = document.createElement('div');
  card.className = 'card';
  let frontHTML = '';
  if(direction === 'h2e'){
    frontHTML = `<div class="front-word heb ${scriptMode?'script':''}">${displayHeb(w.heb)}</div><div class="sentence">${boldSentence(w.sentence, w.heb)}</div>`;
  } else {
    frontHTML = `<div class="front-word">${w.eng}</div><div class="hint">tap or press Flip to reveal Hebrew</div>`;
  }
  card.innerHTML = frontHTML + `<div class="reveal" id="revealArea"></div>`;
  card.addEventListener('click', ()=>{ revealed = !revealed; renderReveal(w); });
  wrap.appendChild(card);
  attachSwipe(card);
  updateStarBtn(w);
  updateCounter();
}
function renderReveal(w){
  const area = document.getElementById('revealArea');
  if(!revealed){ area.innerHTML=''; return; }
  if(direction === 'h2e'){
    area.innerHTML = `<div class="big">${w.eng}</div><div class="translit">${w.translit||''}</div><button class="speak-btn" id="speakBtn">🔊 Hear it</button><div class="addedBy">Added by ${w.addedBy||'Anonymous'}</div>`;
  } else {
    area.innerHTML = `<div class="big heb ${scriptMode?'script':''}">${displayHeb(w.heb)}</div><div class="translit">${w.translit||''}</div>${w.sentence ? `<div class="backSentence">${boldSentence(w.sentence, w.heb)}</div>` : ''}<button class="speak-btn" id="speakBtn">🔊 Hear it</button><div class="addedBy">Added by ${w.addedBy||'Anonymous'}</div>`;
  }
  document.getElementById('speakBtn').addEventListener('click', e=>{ e.stopPropagation(); speak(w.heb); });
}
function speak(text){
  if(!('speechSynthesis' in window)){ alert('Speech not supported on this device.'); return; }
  const utter = new SpeechSynthesisUtterance(stripNiqqud(text));
  utter.lang = 'he-IL';
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}
function updateStarBtn(w){ document.getElementById('starBtn').classList.toggle('starred', !!w.starred); }
document.getElementById('toggleNiqqud').addEventListener('click', e=>{
  showNiqqud = !showNiqqud;
  e.target.textContent = showNiqqud ? 'Hide Dots' : 'Show Dots';
  e.target.classList.toggle('on', !showNiqqud);
  renderCard();
});
document.getElementById('toggleScript').addEventListener('click', e=>{
  scriptMode = !scriptMode;
  e.target.classList.toggle('on', scriptMode);
  renderCard();
});
document.getElementById('filterStar').addEventListener('click', e=>{
  starOnly = !starOnly;
  e.target.classList.toggle('on', starOnly);
  rebuildDeckQueue();
});
document.getElementById('dirHebFirst').addEventListener('click', ()=>{
  direction = 'h2e';
  document.getElementById('dirHebFirst').classList.add('on');
  document.getElementById('dirEngFirst').classList.remove('on');
  renderCard();
});
document.getElementById('dirEngFirst').addEventListener('click', ()=>{
  direction = 'e2h';
  document.getElementById('dirEngFirst').classList.add('on');
  document.getElementById('dirHebFirst').classList.remove('on');
  renderCard();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{ current--; markCardViewed(); renderCard(); });
document.getElementById('nextBtn').addEventListener('click', ()=>{ current++; markCardViewed(); renderCard(); });
document.getElementById('flipBtn').addEventListener('click', ()=>{
  if(deckQueue.length===0) return;
  revealed = !revealed;
  if(revealed) markCardViewed();
  renderReveal(deckQueue[current]);
});
document.getElementById('skipBtn').addEventListener('click', ()=>{ current++; markCardViewed(); renderCard(); });
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  if(deckQueue.length < 2) return;
  let arr = deckQueue.slice();
  let shuffledEnough = false;
  let attempts = 0;
  while(!shuffledEnough && attempts < 5){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    shuffledEnough = arr.some((w,idx)=> w.id !== deckQueue[idx].id) || arr.length < 2;
    attempts++;
  }
  deckQueue = arr;
  current = 0;
  renderCard();
});
document.getElementById('starBtn').addEventListener('click', async ()=>{
  if(deckQueue.length===0) return;
  const w = deckQueue[current];
  await wordsCol.doc(w.id).update({ starred: !w.starred });
});
document.getElementById('editCardBtn').addEventListener('click', ()=>{
  if(deckQueue.length===0) return;
  if(!checkPasscode()) return;
  const w = deckQueue[current];
  editingWordId = w.id;
  document.getElementById('editHeb').value = w.heb || '';
  document.getElementById('editEng').value = w.eng || '';
  document.getElementById('editTranslit').value = w.translit || '';
  document.getElementById('editDeck').value = normDeck(w.deck) || DEFAULT_DECK;
  document.getElementById('editSentence').value = w.sentence || '';
  document.getElementById('editModal').classList.add('show');
});
document.getElementById('editCancelBtn').addEventListener('click', ()=>{
  document.getElementById('editModal').classList.remove('show');
  editingWordId = null;
});
document.getElementById('editSaveBtn').addEventListener('click', async ()=>{
  if(!editingWordId) return;
  const heb = document.getElementById('editHeb').value.trim();
  const eng = document.getElementById('editEng').value.trim();
  if(!heb || !eng){ alert("Hebrew and English are required."); return; }
  await wordsCol.doc(editingWordId).update({
    heb, eng,
    translit: document.getElementById('editTranslit').value.trim(),
    deck: normDeck(document.getElementById('editDeck').value),
    sentence: document.getElementById('editSentence').value.trim()
  });
  document.getElementById('editModal').classList.remove('show');
  editingWordId = null;
});
function attachSwipe(card){
  let startX = 0;
  card.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; });
  card.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 60){ if(dx < 0) current++; else current--; markCardViewed(); renderCard(); }
  });
}
function getPrintWords(){
  let source = words;
  if(activeDeckFilter !== 'ALL') source = source.filter(w=>normDeck(w.deck)===activeDeckFilter);
  if(starOnly) source = source.filter(w=>w.starred);
  return source;
}
function buildPrint(){
  const src = getPrintWords();
  const area = document.getElementById('printArea');
  if(src.length===0){ alert("No cards to print in this deck/filter."); area.innerHTML=''; return; }
  let html = `<div class="print-instructions">Print double-sided • Flip on long edge • ${src.length} cards • Deck: ${activeDeckFilter==='ALL'?'ALL DECKS':activeDeckFilter}</div>`;
  const PER_PAGE = 8;
  for(let i=0;i<src.length;i+=PER_PAGE){
    const chunk = src.slice(i,i+PER_PAGE);
    html += `<div class="print-page"><div class="print-label">FRONT — Hebrew (cards ${i+1}-${i+chunk.length}) — cut along lines</div><div class="print-grid">`;
    chunk.forEach(w=>{ html += `<div class="p-card p-front"><div class="p-heb">${displayHeb(w.heb)}</div>${w.sentence?`<div class="p-sent">${displayHeb(w.sentence)}</div>`:''}</div>`; });
    for(let k=chunk.length;k<PER_PAGE;k++) html+=`<div class="p-card p-empty"></div>`;
    html += `</div></div>`;
    let mirrored=[];
    for(let r=0;r<chunk.length;r+=2){
      if(r+1<chunk.length){ mirrored.push(chunk[r+1]); mirrored.push(chunk[r]); }
      else mirrored.push(chunk[r]);
    }
    html += `<div class="print-page"><div class="print-label">BACK — English (flip on long edge)</div><div class="print-grid">`;
    mirrored.forEach(w=>{ html += `<div class="p-card p-back"><div class="p-eng">${w.eng}</div></div>`; });
    for(let k=chunk.length;k<PER_PAGE;k++) html+=`<div class="p-card p-empty"></div>`;
    html += `</div></div>`;
  }
  area.innerHTML = html;
}
document.getElementById('printBtn').addEventListener('click', ()=>{
  const ok = confirm("To print double-sided:\n\nChoose Double-sided / Two-sided and choose Flip on long edge.\n\nFront = Hebrew, Back = English.\n\nPress OK to continue to print.");
  if(!ok) return;
  buildPrint();
  setTimeout(()=>window.print(),150);
});
</script>
</body>
